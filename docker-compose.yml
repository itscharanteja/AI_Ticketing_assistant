version: "3.8"

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ticketdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ticket-service:
    build: ./ticket-service
    ports:
      - "5001:5000"
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASS=password
      - DB_NAME=ticketdb
    depends_on:
      - postgres

  ai-service:
    build: ./ai-service
    ports:
      - "6000:6000"
    environment:
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
    depends_on:
      - ticket-service

volumes:
  postgres_data:
