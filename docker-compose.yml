version: "3.8"

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ticketdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ticket-service:
    build: ./ticket-service
    ports:
      - "5001:5000"
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASS=password
      - DB_NAME=ticketdb
    depends_on:
      - postgres

  ai-service:
    build: ./ai-service
    ports:
      - "6001:6000"
    environment:
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    depends_on:
      - ticket-service

  frontend:
    build: 
      context: ./frontend
      args:
        - REACT_APP_TICKET_API_URL=http://localhost:5001
        - REACT_APP_AI_API_URL=http://localhost:6001
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_TICKET_API_URL=http://localhost:5001
      - REACT_APP_AI_API_URL=http://localhost:6001
    depends_on:
      - ai-service

volumes:
  postgres_data: